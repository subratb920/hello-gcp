<DOCTYPE html>
<html>
<head>
    <title>Server Status</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
    <div class="status-container">
        <h1>Server Status</h1>
        <div class="status-item">
            <strong>Uptime:</strong> <span id="uptime">{{uptime}}</span>
        </div>
        <div class="status-item">
            <strong>Node Version:</strong> <span id="nodeVersion">{{nodeVersion}}</span>
        </div>
        <div class="status-item">
            <strong>Requests:</strong> <span id="requestCount">{{requestCount}}</span>
        </div>
    </div>
</body>
</html>
